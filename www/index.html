<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VTA tracker</title>
    <script async src="https://andrewmacheret.com/analytics.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="index.js" defer></script>
  </head>
  <body>
    <main id="map" aria-label="Map of VTA buses and light rail trains"></main>
    <section id="status" role="status" aria-live="polite">
      <h1>VTA tracker</h1>
      <p>Where VTA buses and trains should be right now, based on the
        <a href="https://gtfs.vta.org/">published timetable</a>. These are estimates, not live GPS.</p>
      <p id="status-text">Loading&hellip;</p>
    </section>
  </body>
</html>

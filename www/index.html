<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>VTA tracker</title>
    <script async src="https://andrewmacheret.com/analytics.js"></script>
    <meta name="description" content="A live map of where every VTA bus and light rail train in the South Bay should be right now, worked out from the published timetable.">
    <link rel="canonical" href="https://andrewmacheret.com/projects/vta-tracker/">
    <!-- before Leaflet's CSS so Leaflet's own link and button colors win -->
    <link rel="stylesheet" href="https://andrewmacheret.com/projects.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="index.js" defer></script>
  </head>
  <body>
    <main id="map" aria-label="Map of VTA buses and light rail trains"></main>
    <section id="status" class="overlay">
      <h1>VTA tracker</h1>
      <p id="status-text" role="status" aria-live="polite">Loading&hellip;</p>
      <details>
        <summary>About</summary>
        <p>Where VTA buses and trains should be right now, based on the
          <a href="https://gtfs.vta.org/">published timetable</a>. These are estimates, not live GPS.</p>
      </details>
      <footer class="footer">
        <a href="https://andrewmacheret.com/">More projects</a>
        <span aria-hidden="true">&middot;</span>
        <a href="https://github.com/andrewmacheret/vta-tracker-lambda">Source</a>
      </footer>
    </section>
  </body>
</html>
